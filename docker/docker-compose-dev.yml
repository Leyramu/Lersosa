version: '3.8'

services:
  #####################################################################
  ###################                       基础组件                       ###################
  #####################################################################

  lersosa-postgresql:
    image: postgres:18.1-alpine
    container_name: lersosa-postgresql-dev
    build:
      context: ./postgresql
    networks:
      lersosa-network-dev:
        aliases:
          - lersosa-postgresql
    ports:
      - "5432:5432"
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Zcx@223852//
      POSTGRES_DB: lersosa-cloud
    volumes:
      - ./postgresql/data/:/var/lib/postgresql/data/
      - ./postgresql/tls/:/var/tls/
      - ./postgresql/root/:/root/.postgresql/
    command: >
      sh -c "
        chmod 600 /var/tls/lersosa-ca-cert.pem &&
        chmod 600 /var/tls/lersosa-postgresql-server-cert.pem &&
        chmod 600 /var/tls/lersosa-postgresql-server-key.pem &&
        chown postgres:postgres /var/tls/lersosa-ca-cert.pem &&
        chown postgres:postgres /var/tls/lersosa-postgresql-server-cert.pem &&
        chown postgres:postgres /var/tls/lersosa-postgresql-server-key.pem &&
      
        mkdir -p /root/.postgresql &&
        chmod 600 /root/.postgresql/lersosa-ca-cert.pem &&
        chmod 600 /root/.postgresql/lersosa-postgresql-client-cert.pem &&
        chmod 600 /root/.postgresql/lersosa-postgresql-client-key.pem &&
        chown postgres:postgres /root/.postgresql/lersosa-ca-cert.pem &&
        chown postgres:postgres /root/.postgresql/lersosa-postgresql-client-cert.pem &&
        chown postgres:postgres /root/.postgresql/lersosa-postgresql-client-key.pem &&
      
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/tls/lersosa-postgresql-server-cert.pem \
          -c ssl_key_file=/var/tls/lersosa-postgresql-server-key.pem \
          -c ssl_ca_file=/var/tls/lersosa-ca-cert.pem \
          -c ssl_prefer_server_ciphers = on \
          -c ssl_min_protocol_version='TLSv1.2'
      "
    privileged: true

  lersosa-redis:
    image: redis:8.4.0-alpine
    container_name: lersosa-redis-dev
    build:
      context: ./redis
    networks:
      lersosa-network-dev:
        aliases:
          - lersosa-redis
    ports:
      - "6380:6380"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./redis/config/:/redis/config/
      - ./redis/data/:/redis/data/
      - ./redis/certs/:/redis/certs/
    command: "redis-server /redis/config/redis.conf"
    privileged: true

  lersosa-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lersosa-minio-dev
    build:
      context: ./minio
    networks:
      lersosa-network-dev:
        aliases:
          - lersosa-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: lersosa
      MINIO_ROOT_PASSWORD: Zcx@223852//
      MINIO_COMPRESS: "off"
      MINIO_COMPRESS_EXTENSIONS: ""
      MINIO_COMPRESS_MIME_TYPES: ""
    volumes:
      - ./minio/data:/data
      - ./minio/config:/root/.minio/
    command: server --address ':9000' --console-address ':9001' /data
    privileged: true

  lersosa-elasticsearch:
    image: elasticsearch:9.2.3
    container_name: lersosa-elasticsearch-dev
    build:
      context: ./elk
    networks:
      lersosa-network-dev:
        aliases:
          - lersosa-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      cluster.name: "elasticsearch-cluster"
      ELASTIC_PASSWORD: Zcx@223852//
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      ES_JAVA_LOCALE: zh_CN
    volumes:
      - ./elk/elasticsearch/plugins:/usr/share/elasticsearch/plugins
      - ./elk/elasticsearch/data:/usr/share/elasticsearch/data
      - ./elk/elasticsearch/logs:/usr/share/elasticsearch/logs
      - ./elk/elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./elk/elasticsearch/config/lersosa-ca-cert.pem:/usr/share/elasticsearch/config/lersosa-ca-cert.pem
      - ./elk/elasticsearch/config/lersosa-elasticsearch-server-cert.pem:/usr/share/elasticsearch/config/lersosa-elasticsearch-server-cert.pem
      - ./elk/elasticsearch/config/lersosa-elasticsearch-server-key.pem:/usr/share/elasticsearch/config/lersosa-elasticsearch-server-key.pem
      - ./elk/elasticsearch/config/lersosa-elasticsearch-client-cert.pem:/usr/share/elasticsearch/config/lersosa-elasticsearch-client-cert.pem
      - ./elk/elasticsearch/config/lersosa-elasticsearch-client-key.pem:/usr/share/elasticsearch/config/lersosa-elasticsearch-client-key.pem
    healthcheck:
      test: [ "CMD-SHELL", "curl --cacert /usr/share/elasticsearch/config/lersosa-ca-cert.pem --cert /usr/share/elasticsearch/config/lersosa-elasticsearch-client-cert.pem --key /usr/share/elasticsearch/config/lersosa-elasticsearch-client-key.pem -u elastic:Zcx@223852// -s https://localhost:9200/_cluster/health | grep -E 'green|yellow'" ]
      interval: 30s
      timeout: 10s
      retries: 5

  #####################################################################
  ###################                       监控模块                       ###################
  #####################################################################

  lersosa-kibana:
    image: kibana:9.2.3
    container_name: lersosa-kibana-dev
    build:
      context: ./elk
    networks:
      lersosa-network-dev:
        aliases:
          - lersosa-kibana
    ports:
      - "5601:5601"
    environment:
      I18N_LOCALE: zh-CN
    volumes:
      - ./elk/kibana/plugins:/usr/share/kibana/plugins
      - ./elk/kibana/data:/usr/share/kibana/data
      - ./elk/kibana/logs:/usr/share/kibana/logs
      - ./elk/kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
      - ./elk/kibana/config/lersosa-ca-cert.pem:/usr/share/kibana/config/lersosa-ca-cert.pem
      - ./elk/kibana/config/lersosa-kibana-server-cert.pem:/usr/share/kibana/config/lersosa-kibana-server-cert.pem
      - ./elk/kibana/config/lersosa-kibana-server-key.pem:/usr/share/kibana/config/lersosa-kibana-server-key.pem
      - ./elk/kibana/config/lersosa-kibana-client-cert.pem:/usr/share/kibana/config/lersosa-kibana-client-cert.pem
      - ./elk/kibana/config/lersosa-kibana-client-key.pem:/usr/share/kibana/config/lersosa-kibana-client-key.pem
    depends_on:
      lersosa-elasticsearch:
        condition: service_healthy

#####################################################################
###################                       环境网络                       ###################
#####################################################################

networks:
  lersosa-network-dev:
    name: lersosa-network-dev
    driver: bridge
    ipam:
      config:
        - subnet: 174.17.0.0/16
          gateway: 174.17.0.1
