syntax = "proto3";

package api.stellar.service.v1.status.proto;

option go_package = "api/stellar/service/v1/status;status";

// 获取星体状态列表请求
message StatusListRequest {
  int32 flag = 1;
  int32 check = 2;
}

// 获取星体状态列表响应
message StatusListReply {
  // 星体状态
  message Status {
    string status_id = 1;
    string info_id = 2;
    string file_url = 3;
    double score = 4;
    int32 flag = 5;
    int32 check = 6;
    int64 create_by = 7;
    string create_time = 8;
    int64 update_by = 9;
    string update_time = 10;
    string remark = 11;
    int32 version = 12;
  }

  repeated Status lists = 1;
}