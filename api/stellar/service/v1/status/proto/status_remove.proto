syntax = "proto3";

package api.stellar.service.v1.status.proto;

option go_package = "api/stellar/service/v1/status;status";

// 星体状态删除请求
message StatusRemoveRequest {
  //星体状态
  message Status {
    string status_id = 1;
    int32 version = 2;
  }

  repeated Status statuses = 1;
}

// 星体状态删除响应
message StatusRemoveReply {}
