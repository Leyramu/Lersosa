syntax = "proto3";

package api.stellar.service.v1.info.proto;

option go_package = "api/stellar/service/v1/info;info";

// 星体信息修改请求
message InfoModifyRequest {
  string info_id = 1;
  string name = 2;
  double period = 3;
  double dispersion_measure = 4;
  double ra_deg = 5;
  double dec_deg = 6;
  double galactic_longitude = 7;
  double galactic_latitude = 8;
  string survey_name = 9;
  int64 update_by = 10;
  string remark = 11;
  int32 version = 12;
}

// 星体信息修改响应
message InfoModifyReply {}