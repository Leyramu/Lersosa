syntax = "proto3";

package api.resource.interface.v1.file.proto;

option go_package = "api/resource/interface/v1/file;file";

// 获取文件请求
message FileGetRequest {
  string oss_id = 1;
}

// 获取文件响应
message FileGetReply {
  // 文件
  message File {
    string oss_id = 1;
    string file_name = 2;
    string original_name = 3;
    string file_suffix = 4;
    string url = 5;
    string ext1 = 6;
    string service = 7;
    int32 version = 8;
  }

  int32 code = 1;
  string msg = 2;
  File data = 3;
}
