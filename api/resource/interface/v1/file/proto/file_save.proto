syntax = "proto3";

package api.resource.interface.v1.file.proto;

option go_package = "api/resource/interface/v1/file;file";

// 保存文件请求
message FileSaveRequest {
  string file_name = 1;
  string origin_name = 2;
  string file_suffix = 3;
  string url = 4;
  string ext1 = 5;
  int64 create_dept = 6;
  int64 create_by = 7;
  string service = 8;
}

// 保存文件响应
message FileSaveReply {
  // 数据
  message Data {}

  int32 code = 1;
  string msg = 2;
  Data data = 3;
}
