syntax = "proto3";

package api.resource.interface.v1.file.proto;

option go_package = "api/resource/interface/v1/file;file";

// 删除文件请求
message FileRemoveRequest {
  // 文件
  message File {
    string oss_id = 1;
    int32 version = 2;
  }

  repeated File files = 1;
}

// 删除文件响应
message FileRemoveReply {
  // 数据
  message Data {}

  int32 code = 1;
  string msg = 2;
  Data data = 3;
}
