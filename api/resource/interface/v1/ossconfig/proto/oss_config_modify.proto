syntax = "proto3";

package api.resource.interface.v1.ossconfig.proto;

option go_package = "api/resource/interface/v1/ossconfig;ossconfig";

// 修改资源配置请求
message OssConfigModifyRequest {
  string oss_config_id = 1;
  string config_key = 2;
  string access_key = 3;
  string secret_key = 4;
  string  bucket_name = 5;
  string prefix = 6;
  string endpoint = 7;
  string domain = 8;
  string is_https = 9;
  string region = 10;
  string access_policy = 11;
  string status = 12;
  string ext1 = 13;
  int64 update_by = 14;
  string remark = 15;
  int32 version = 16;
}

// 修改资源配置响应
message OssConfigModifyReply {
  // 数据
  message Data {}

  int32 code = 1;
  string msg = 2;
  Data data = 3;
}
