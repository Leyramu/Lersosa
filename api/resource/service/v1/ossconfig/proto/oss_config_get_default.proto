syntax = "proto3";

package api.resource.service.v1.ossconfig.proto;

option go_package = "api/resource/service/v1/ossconfig;ossconfig";

// 获取默认配置请求
message OssConfigGetDefaultRequest {}

// 获取默认配置返回
message OssConfigGetDefaultReply {
  string oss_config_id = 1;
  string config_key = 2;
  string access_key = 3;
  string secret_key = 4;
  string  bucket_name = 5;
  string prefix = 6;
  string endpoint = 7;
  string domain = 8;
  string is_https = 9;
  string region = 10;
  string access_policy = 11;
  string status = 12;
  string ext1 = 13;
}

