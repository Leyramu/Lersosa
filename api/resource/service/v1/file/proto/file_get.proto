syntax = "proto3";

package api.resource.service.v1.file.proto;

option go_package = "api/resource/service/v1/file;file";

// 获取文件请求
message FileGetRequest {
  string oss_id = 1;
}

// 获取文件响应
message FileGetReply {
  string oss_id = 1;
  string file_name = 2;
  string original_name = 3;
  string file_suffix = 4;
  string url = 5;
  string ext1 = 6;
  int64 create_dept = 7;
  int64 create_by = 8;
  int64 create_time = 9;
  int64 update_by = 10;
  int64 update_time = 11;
  string service = 12;
  int32 version = 13;
}
