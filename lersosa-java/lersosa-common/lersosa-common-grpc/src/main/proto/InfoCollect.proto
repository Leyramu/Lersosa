syntax = "proto3";

option java_package = "leyramu.framework.lersosa.common.grpc.lib.python";

service InfoCollect {
    rpc SaveInfo (InfoCollectRequestList) returns (InfoCollectReply) {}
}

message InfoCollectRequestList {
    repeated InfoCollectRequest info = 1;
}

message InfoCollectRequest {
    string name = 1;
    double score = 2;
}

message InfoCollectReply {
    int32 code = 1;
    string message = 2;
    string data = 3;
}
