[package]
name = "lersosa-serving"
version = "0.1.0"
edition = "2024"

[features]
default = ["ndarray"]
ndarray = ["lersosa-core/ndarray"]
wgpu = ["lersosa-core/wgpu"]
vulkan = ["lersosa-core/vulkan"]
cuda = ["lersosa-core/cuda"]
tch = ["lersosa-core/tch", "burn/tch"]

[dependencies]
axum = { version = "0.8", features = ["json"] }
burn = { version = "0.21.0-pre.2", default-features = false, features = ["std", "dispatch"] }
lersosa-core = { path = "../lersosa-core", default-features = false }
lersosa-crawler = { path = "../lersosa-crawler" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = "0.29"
thiserror = "2.0"
tonic = { version = "0.14", features = ["transport"] }
prost = "0.14"
tonic-prost = "0.14"
toml = "1.0.7"
tokio-stream = "0.1"
tokio = { version = "1.48", features = ["rt", "sync"] }

[build-dependencies]
protoc-bin-vendored = "3.2"
tonic-prost-build = "0.14"
