[package]
name = "lersosa-crawler"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
mongodb = "3.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "json", "gzip", "brotli", "deflate"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.0.7"
tracing = "0.1"
url = "2.5"

