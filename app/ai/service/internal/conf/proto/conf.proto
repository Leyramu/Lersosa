syntax = "proto3";

package kratos.api;

option go_package = "lersosa/app/ai/service/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
    bool tls_enable = 4;
    string cert_file = 5;
    string key_file = 6;
    string ca_file = 7;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
    bool tls_enable = 4;
    string cert_file = 5;
    string key_file = 6;
    string ca_file = 7;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
    int32 max_open_conns = 3;
    int32 max_idle_conns = 4;
    google.protobuf.Duration conn_max_lifetime = 5;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    string password = 3;
    google.protobuf.Duration read_timeout = 4;
    google.protobuf.Duration write_timeout = 5;
    bool tls_enable = 6;
    string cert_file = 7;
    string key_file = 8;
    string ca_file = 9;
  }
  message ElasticSearch {
    string network = 1;
    repeated string addr = 2;
    string username = 3;
    string password = 4;
    string api_key = 5;
    string cloud_id = 6;
    bool tls_enable = 7;
    string cert_file = 8;
    string key_file = 9;
    string ca_file = 10;
  }
  message ChatModel {
    string provider = 1;
    string model = 2;
    string base_url = 3;
    string api_key = 4;
    google.protobuf.Duration timeout = 5;
  }
  Database database = 1;
  Redis redis = 2;
  ElasticSearch elasticsearch = 3;
  ChatModel chat_model = 4;
}
